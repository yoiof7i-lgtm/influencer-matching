version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: influencer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-influencer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-influencer_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-influencer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - .env
    container_name: influencer_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-influencer}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-influencer_db}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app
      - ./frontend:/code/frontend:ro
      - ./backend/uploads:/code/uploads
    command: sh -c "while true; do uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload; echo '[wrapper] uvicorn crashed — restarting in 3s'; sleep 3; done"

volumes:
  pgdata:
