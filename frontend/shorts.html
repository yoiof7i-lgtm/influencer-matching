<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쇼핑 쇼츠 대본 & 프롬프트 자동 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-gray-100 p-6">
  <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">🛍 쇼핑 쇼츠 AI 생성기</h1>

    <!-- 공급자 선택 -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">AI 공급자</label>
      <select id="provider" onchange="onProviderChange()" class="w-full p-2 border rounded-md bg-white">
        <option value="gemini">Gemini (Google) — 무료</option>
        <option value="openrouter">OpenRouter — Gemini 막힐 때 대안</option>
      </select>
    </div>

    <!-- API 키 입력 -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1" id="keyLabel">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
      <p class="text-xs text-gray-400 mt-1" id="keyHint">키는 이 화면에서만 사용되고 저장되지 않습니다</p>
      <div id="or-model-box" class="hidden mt-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">모델 선택</label>
        <select id="orModel" class="w-full p-2 border rounded-md bg-white">
          <option value="dots-studio/dots-3-note-preview:free">Dots 3 Note (무료·실측성공)</option>
          <option value="google/gemma-4-31b-it:free">Gemma 4 (무료)</option>
          <option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash (유료·빠름)</option>
          <option value="google/gemini-2.5-flash">Gemini 2.5 Flash (유료)</option>
        </select>
        <p class="text-xs text-gray-400 mt-1">free 모델은 비용 0원</p>
      </div>
    </div>

    <!-- 이미지 및 상품 설명 입력 -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">상품 사진 업로드</label>
      <input type="file" id="imageInput" accept="image/*" multiple class="w-full p-2 border rounded-md">
      <p class="text-xs text-gray-400 mt-1">사진 1~3장 업로드 가능 — 여러 각도의 사진이면 대본이 더 좋아집니다</p>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">추가 상품 정보 (가격, 핵심 특징 등)</label>
      <textarea id="productInfo" rows="3" placeholder="예: 할인가 19,900원 / 무선충전 지원 / 방수 가능" class="w-full p-2 border rounded-md"></textarea>
    </div>

    <button onclick="generateShorts()" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
      쇼츠 대본 및 연출안 생성하기
    </button>

    <!-- 결과 출력 영역 -->
    <div id="resultArea" class="mt-8 hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl font-bold text-gray-800">✨ 생성 결과</h2>
        <button onclick="copyResult()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-md">📋 복사</button>
      </div>
      <div id="output" class="p-4 bg-gray-50 border rounded-lg whitespace-pre-wrap text-sm leading-relaxed text-gray-800"></div>
    </div>
  </div>

  <script>
    function onProviderChange() {
      const p = document.getElementById('provider').value;
      document.getElementById('keyLabel').textContent = p==='gemini' ? 'Gemini API Key' : 'OpenRouter API Key (sk-or-v1-...)';
      document.getElementById('apiKey').placeholder = p==='gemini' ? 'AIzaSy...' : 'sk-or-v1-...';
      document.getElementById('or-model-box').classList.toggle('hidden', p!=='openrouter');
    }

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function generateShorts() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const imageInput = document.getElementById('imageInput');
      const productInfo = document.getElementById('productInfo').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const resultArea = document.getElementById('resultArea');
      const output = document.getElementById('output');

      if (!apiKey) return alert('Gemini API 키를 입력해주세요.');
      const files = Array.from(imageInput.files || []);
      if (!files.length) return alert('상품 사진을 업로드해주세요.');
      if (files.length > 3) { files.length = 3; alert('사진은 앞 3장만 사용합니다.'); }

      submitBtn.disabled = true;
      submitBtn.innerText = "AI 분석 및 대본 생성 중...";
      resultArea.classList.remove('hidden');
      output.innerText = "이미지를 분석하고 최적의 쇼츠 구조를 짜는 중입니다...";

      try {
        const promptText = `
너는 100만 조회수를 만드는 숏폼 커머스 마케팅 전문가야.
업로드된 상품 이미지들과 추가 정보 [${productInfo}]를 바탕으로 숏폼(유튜브 쇼츠/릴스/틱톡) 영상을 위한 대본 및 연출 가이드를 작성해줘.
사진이 여러 장이면 순서대로 연출에 활용해줘.

다음 양식에 맞춰 답변해줘:
1. 🎯 [후킹 썸네일/헤드라인] (시청자를 3초 안에 사로잡을 강력한 문구)
2. 🎙 [TTS 음성 대본] (약 30~40초 분량, 자연스럽고 빠른 템포의 구어체)
3. 🎬 [초별 영상 연출 가이드]
   - 0~3초: (화면 연출 및 이미지 자막 위치)
   - 3~10초: ...
4. 🏷 [추천 태그 및 키워드] (쿠팡 파트너스/스마트스토어용 태그)
        `;

        // 사진 1~3장을 parts에 포함
        const parts = [{ text: promptText }];
        for (const f of files) {
          const dataUrl = await convertBase64(f);
          parts.push({ inline_data: { mime_type: f.type, data: dataUrl.split(',')[1] } });
        }

        // 은퇴 모델 대비 fallback
        const models = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-flash-latest', 'gemini-2.0-flash-lite', 'gemini-pro'];
        let data = null;
        for (const m of models) {
          output.innerText = `🔄 모델 시도 중: ${m} ...`;
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: parts }] })
          });
          data = await response.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) break;
          if (data.error && /not found|not supported|no longer available|high demand|overloaded|temporarily/i.test(data.error.message || '')) continue;
          break;
        }

        if (data && data.candidates && data.candidates[0].content.parts[0].text) {
          output.innerText = data.candidates[0].content.parts[0].text;
        } else if (data && data.error) {
          output.innerText = "⚠ API 오류: " + (data.error.message || JSON.stringify(data.error));
        } else {
          output.innerText = "오류 발생: " + JSON.stringify(data);
        }
      } catch (err) {
        output.innerText = "요청 중 오류가 발생했습니다: " + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "쇼츠 대본 및 연출안 생성하기";
      }
    }

    function copyResult() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text).then(
        () => { alert('복사 완료!'); },
        () => { alert('복사 실패 — 텍스트를 직접 선택해주세요'); }
      );
    }
  </script>
</body>
</html>
